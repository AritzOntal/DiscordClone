version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: discord_postgres
    restart: always
    environment:
      POSTGRES_USER: aritz
      POSTGRES_PASSWORD: aritz
      POSTGRES_DB: discord_db
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      
volumes:
  postgres_data:
